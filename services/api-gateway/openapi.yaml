  # ══════════════════════════════════════════
  # 실시간 이벤트 (SSE)
  # ══════════════════════════════════════════

  /api/events/exports:
    get:
      tags:
        - 실시간이벤트
      summary: 내보내기 작업 상태 SSE 스트림
      description: |
        현재 사용자의 PDF/ZIP 내보내기 작업 상태를 실시간으로 수신합니다.

        **프로토콜**: Server-Sent Events (SSE)
        **Content-Type**: `text/event-stream`

        연결 후 수신되는 이벤트 형식:
        ```
        :ok

        event: export-status
        data: {"jobId":"job_abc","status":"completed","requestedBy":"user_123","url":"..."}

        :heartbeat
        ```

        이벤트 필드:
        - `event`: 항상 `export-status`
        - `data`: JSON 문자열 (signature-audit-service의 `export-status` Redis 채널 메시지)

        heartbeat는 30초마다 전송되며 연결 유지 확인에 사용됩니다.
        Redis `export-status` 채널에서 `requestedBy === 현재 사용자 ID`인 메시지만 필터링하여 전달합니다.

        클라이언트가 연결을 끊으면 Redis subscriber와 heartbeat interval이 자동 정리됩니다.
      operationId: streamExportStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: SSE 스트림 연결 성공
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE 이벤트 스트림.
                  각 이벤트는 `event:` + `data:` 쌍으로 구성되며 `\n\n`으로 구분됩니다.
              example: |
                :ok

                event: export-status
                data: {"jobId":"job_abc","status":"completed","requestedBy":"user_123","downloadUrl":"/api/exports/job_abc"}

                :heartbeat
        '401':
          description: 인증 실패 — SSE 연결 전에 반환됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkFalse'
              example:
                ok: false
                error: "인증이 필요합니다."
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/events/notifications:
    get:
      tags:
        - 실시간이벤트
      summary: 알림 실시간 SSE 스트림
      description: |
        현재 사용자에게 발송된 알림을 실시간으로 수신합니다.

        **프로토콜**: Server-Sent Events (SSE)
        **Content-Type**: `text/event-stream`

        연결 후 수신되는 이벤트 형식:
        ```
        :ok

        event: notification
        data: {"id":"notif_abc","type":"NOTE_SIGNED","message":"노트가 서명되었습니다.","createdAt":"2026-03-25T09:00:00.000Z"}

        :heartbeat
        ```

        이벤트 필드:
        - `event`: 항상 `notification`
        - `data`: JSON 문자열 (signature-audit-service가 `notifications:{userId}` Redis 채널로 발행한 메시지)

        사용자별 전용 Redis 채널(`notifications:{userId}`)을 구독하므로
        해당 사용자의 알림만 수신됩니다.

        heartbeat는 30초마다 전송됩니다.
        클라이언트가 연결을 끊으면 Redis subscriber와 heartbeat interval이 자동 정리됩니다.
      operationId: streamNotifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: SSE 스트림 연결 성공
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 이벤트 스트림
              example: |
                :ok

                event: notification
                data: {"id":"notif_abc","type":"NOTE_SIGNED","message":"노트 '실험 노트 A'가 서명되었습니다.","createdAt":"2026-03-25T09:00:00.000Z","read":false}

                :heartbeat
        '401':
          description: 인증 실패 — SSE 연결 전에 반환됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkFalse'
              example:
                ok: false
                error: "인증이 필요합니다."
        '500':
          $ref: '#/components/responses/InternalServerError'
