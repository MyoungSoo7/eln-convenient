  /api/dashboard:
    get:
      tags:
        - 대시보드
      summary: 통합 대시보드 조회 (기존 호환)
      description: |
        개인과 조직 데이터를 현재 사용자의 권한 범위 내에서 통합 집계합니다.

        이 엔드포인트는 **하위 호환성**을 위해 유지됩니다.
        신규 개발에는 역할에 맞는 세분화된 엔드포인트(`/personal`, `/team/:teamId`, `/org`)를 사용하십시오.

        다음 서비스에서 데이터를 병렬로 집계합니다 (현재 사용자 권한으로 호출):
        - **eln-service**: 노트 상태 통계, 최근 노트 4건
        - **signature-audit-service**: 컴플라이언스 통계, 최근 감사 로그 5건
        - **inventory-service**: 전체 항목 수, 재고 부족 항목, 30일 내 만료 예정 항목
        - **scheduler-service**: 승인 대기 예약 수, 오늘 이후 예약 4건

        응답은 **5분간 Redis에 캐시**됩니다 (`cache:dashboard:{orgId}:{role}`).
