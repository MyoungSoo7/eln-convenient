        조직 전체 현황을 집계한 대시보드 데이터를 반환합니다.

        **접근 제한**: `admin` 역할만 접근 가능합니다.

        다음 서비스에서 데이터를 병렬로 집계합니다 (admin 권한으로 호출):
        - **eln-service**: 전체 노트 상태 통계, 최근 노트 4건
        - **signature-audit-service**: 컴플라이언스 통계, 최근 감사 로그 10건
        - **inventory-service**: 전체 항목 수, 재고 부족 항목, 30일 내 만료 예정 항목
        - **scheduler-service**: 승인 대기 예약 수, 오늘 이후 예약 4건

        응답은 **5분간 Redis에 캐시**됩니다 (`cache:dashboard:org:{orgId}`).
      operationId: getOrgDashboard
      security:
