# LabNote ELN - Docker Compose 설정
# 실행: docker compose up --build
# 접속: http://localhost:3000 (프론트엔드), http://localhost:8000 (API Gateway)

version: '3.8'

services:
  # ═══════════════════════════════════════════
  #  공용 인프라
  # ═══════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: labnote-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labnote_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-labnote}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labnote"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labnote-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: labnote-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: labnote-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: labnote-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: labnote-keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/labnote
      - KC_DB_USERNAME=${POSTGRES_USER:-labnote}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-labnote_secret_2024}
      - KC_DB_SCHEMA=keycloak
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-labnote.json:/opt/keycloak/data/import/realm-labnote.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ═══════════════════════════════════════════
  #  백엔드 서비스
  # ═══════════════════════════════════════════

  auth-service:
    build: ./auth-service
    container_name: labnote-auth
    ports:
      - "${AUTH_PORT:-8001}:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://labnote:labnote_secret_2024@postgres:5432/labnote?schema=auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  eln-service:
    build: ./eln-service
    container_name: labnote-eln
    ports:
      - "${ELN_PORT:-8002}:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://labnote:labnote_secret_2024@postgres:5432/labnote?schema=eln
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  signature-audit-service:
    build: ./signature-audit-service
    container_name: labnote-signature
    ports:
      - "${SIGNATURE_PORT:-8003}:8003"
    environment:
      - PORT=8003
      - DATABASE_URL=postgresql://labnote:labnote_secret_2024@postgres:5432/labnote?schema=signature
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=labnote-files
      - ELN_SERVICE_URL=http://eln-service:8002
      - AUTH_SERVICE_URL=http://auth-service:8001
      - INTERNAL_SECRET=${INTERNAL_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      eln-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  inventory-service:
    build: ./inventory-service
    container_name: labnote-inventory
    ports:
      - "${INVENTORY_PORT:-8004}:8004"
    environment:
      - PORT=8004
      - DATABASE_URL=postgresql://labnote:labnote_secret_2024@postgres:5432/labnote?schema=inventory
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler-service:
    build: ./scheduler-service
    container_name: labnote-scheduler
    ports:
      - "${SCHEDULER_PORT:-8005}:8005"
    environment:
      - PORT=8005
      - DATABASE_URL=postgresql://labnote:labnote_secret_2024@postgres:5432/labnote?schema=scheduler
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  search-service:
    build: ./search-service
    container_name: labnote-search
    ports:
      - "${SEARCH_PORT:-8006}:8006"
    environment:
      - PORT=8006
      - OPENSEARCH_URL=http://opensearch:9200
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-assistant-service:
    build: ./ai-assistant-service
    container_name: labnote-ai
    ports:
      - "${AI_PORT:-8007}:8007"
    environment:
      - PORT=8007
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8007/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  file-service:
    build: ./file-service
    container_name: labnote-file
    ports:
      - "${FILE_PORT:-8008}:8008"
    environment:
      - PORT=8008
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=labnote-files
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  collab-service:
    build: ./collab-service
    container_name: labnote-collab
    ports:
      - "${COLLAB_PORT:-8009}:8009"
    environment:
      - PORT=8009
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8009/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build: ./api-gateway
    container_name: labnote-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ELN_SERVICE_URL=http://eln-service:8002
      - SIGNATURE_SERVICE_URL=http://signature-audit-service:8003
      - INVENTORY_SERVICE_URL=http://inventory-service:8004
      - SCHEDULER_SERVICE_URL=http://scheduler-service:8005
      - SEARCH_SERVICE_URL=http://search-service:8006
      - AI_SERVICE_URL=http://ai-assistant-service:8007
      - FILE_SERVICE_URL=http://file-service:8008
      - COLLAB_SERVICE_URL=http://collab-service:8009
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - KEYCLOAK_ENABLED=${KEYCLOAK_ENABLED:-false}
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/labnote/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER=http://keycloak:8080/realms/labnote
    depends_on:
      auth-service:
        condition: service_healthy
      eln-service:
        condition: service_healthy
      signature-audit-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      ai-assistant-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      collab-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  opensearch_data:
  qdrant_data:
  keycloak_data: