# LabNote ELN - Docker Compose 설정
# 실행: docker compose up --build
# 접속: http://localhost:3000 (프론트엔드), http://localhost:8000 (API Gateway)

version: '3.8'

services:
  # ═══════════════════════════════════════════
  #  공용 인프라
  # ═══════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: labnote-postgres
    command: >
      postgres
      -c max_connections=30
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=4MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-labnote}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labnote"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labnote-redis
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save "300 1"
      --tcp-keepalive 60
      --timeout 300
      --databases 4
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: labnote-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER를 설정하세요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD를 설정하세요}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: labnote-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
    entrypoint:
      - /bin/bash
      - -c
      - |
        /usr/share/opensearch/bin/opensearch-plugin install --batch analysis-nori 2>/dev/null || true
        /usr/share/opensearch/opensearch-docker-entrypoint.sh
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: labnote-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ═══════════════════════════════════════════
  #  백엔드 서비스
  # ═══════════════════════════════════════════

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: labnote-auth
    expose:
      - "8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-labnote}?schema=auth&client_encoding=UTF8&connection_limit=3&pool_timeout=10
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 환경변수를 반드시 설정하세요}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-Admin1234!}
      - RESEARCHER_INITIAL_PASSWORD=${RESEARCHER_INITIAL_PASSWORD:-Researcher1234!}
      - REVIEWER_INITIAL_PASSWORD=${REVIEWER_INITIAL_PASSWORD:-Reviewer1234!}
      - DEFAULT_RESET_PASSWORD=${DEFAULT_RESET_PASSWORD:-eln0330}
      - INTERNAL_SECRET=${INTERNAL_SECRET:-dev-internal-secret}
      - INTERNAL_SECRET_PREVIOUS=${INTERNAL_SECRET_PREVIOUS:-}
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  eln-service:
    build:
      context: .
      dockerfile: eln-service/Dockerfile
    container_name: labnote-eln
    expose:
      - "8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-labnote}?schema=eln&client_encoding=UTF8&connection_limit=3&pool_timeout=10
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:8001
      - SIGNATURE_SERVICE_URL=http://signature-audit-service:8003
      - INTERNAL_SECRET=${INTERNAL_SECRET:-dev-internal-secret}
      - INTERNAL_SECRET_PREVIOUS=${INTERNAL_SECRET_PREVIOUS:-}
      - SEARCH_SERVICE_URL=http://search-service:8006
      - SEED_ON_START=true
      - OTEL_SERVICE_NAME=eln-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      search-service:
        condition: service_started
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  signature-audit-service:
    build:
      context: .
      dockerfile: signature-audit-service/Dockerfile
    container_name: labnote-signature
    shm_size: '256m'
    expose:
      - "8003"
    environment:
      - PORT=8003
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-labnote}?schema=signature&client_encoding=UTF8&connection_limit=3&pool_timeout=10
      - REDIS_URL=redis://redis:6379
      - ELN_SERVICE_URL=http://eln-service:8002
      - AUTH_SERVICE_URL=http://auth-service:8001
      - FILE_SERVICE_URL=http://file-service:8008
      - INTERNAL_SECRET=${INTERNAL_SECRET:-dev-internal-secret}
      - INTERNAL_SECRET_PREVIOUS=${INTERNAL_SECRET_PREVIOUS:-}
      - OTEL_SERVICE_NAME=signature-audit-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eln-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: labnote-inventory
    expose:
      - "8004"
    environment:
      - PORT=8004
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-labnote}?schema=inventory&client_encoding=UTF8&connection_limit=3&pool_timeout=10
      - REDIS_URL=redis://redis:6379
      - SEARCH_SERVICE_URL=http://search-service:8006
      - INTERNAL_SECRET=${INTERNAL_SECRET:-dev-internal-secret}
      - INTERNAL_SECRET_PREVIOUS=${INTERNAL_SECRET_PREVIOUS:-}
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      search-service:
        condition: service_started
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler-service:
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    container_name: labnote-scheduler
    expose:
      - "8005"
    environment:
      - PORT=8005
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-labnote}?schema=scheduler&client_encoding=UTF8&connection_limit=3&pool_timeout=10
      - INTERNAL_SECRET=${INTERNAL_SECRET:-dev-internal-secret}
      - INTERNAL_SECRET_PREVIOUS=${INTERNAL_SECRET_PREVIOUS:-}
      - OTEL_SERVICE_NAME=scheduler-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    container_name: labnote-search
    expose:
      - "8006"
    environment:
      - PORT=8006
      - OPENSEARCH_URL=http://opensearch:9200
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-labnote}?schema=search&client_encoding=UTF8&connection_limit=3&pool_timeout=10
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SECRET=${INTERNAL_SECRET:-dev-internal-secret}
      - INTERNAL_SECRET_PREVIOUS=${INTERNAL_SECRET_PREVIOUS:-}
      - OTEL_SERVICE_NAME=search-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-assistant-service:
    build: ./ai-assistant-service
    container_name: labnote-ai
    expose:
      - "8007"
    environment:
      - PORT=8007
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8007/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  file-service:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    container_name: labnote-file
    expose:
      - "8008"
    environment:
      - PORT=8008
      - STORAGE_TYPE=${STORAGE_TYPE:-minio}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?}
      - MINIO_BUCKET=labnote-files
      - MINIO_EXPORTS_BUCKET=labnote-exports
      - MINIO_PUBLIC_URL=http://localhost:9000
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-labnote}?schema=file&client_encoding=UTF8&connection_limit=3&pool_timeout=10
      - ELN_SERVICE_URL=http://eln-service:8002
      - INTERNAL_SECRET=${INTERNAL_SECRET:-dev-internal-secret}
      - INTERNAL_SECRET_PREVIOUS=${INTERNAL_SECRET_PREVIOUS:-}
      - OTEL_SERVICE_NAME=file-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  collab-service:
    build: ./collab-service
    container_name: labnote-collab
    expose:
      - "8009"
    environment:
      - PORT=8009
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 환경변수를 반드시 설정하세요}
      - REDIS_URL=redis://redis:6379
      - OTEL_SERVICE_NAME=collab-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8009/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  inventory-frontend:
    build: ./inventory-frontend
    container_name: labnote-inventory-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway:
    build: ./api-gateway
    container_name: labnote-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ELN_SERVICE_URL=http://eln-service:8002
      - SIGNATURE_SERVICE_URL=http://signature-audit-service:8003
      - INVENTORY_SERVICE_URL=http://inventory-service:8004
      - SCHEDULER_SERVICE_URL=http://scheduler-service:8005
      - SEARCH_SERVICE_URL=http://search-service:8006
      - AI_SERVICE_URL=http://ai-assistant-service:8007
      - FILE_SERVICE_URL=http://file-service:8008
      - COLLAB_SERVICE_URL=http://collab-service:8009
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 환경변수를 반드시 설정하세요}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - REDIS_URL=redis://redis:6379
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      eln-service:
        condition: service_healthy
      signature-audit-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      collab-service:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════
  #  개발 도구
  # ═══════════════════════════════════════════

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: labnote-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dozzle:
    image: amir20/dozzle:latest
    container_name: labnote-dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  opensearch_data:
  qdrant_data: