openapi: 3.0.3
info:
  title: ELN 서비스 API
  description: |
    LabNote 전자연구노트(ELN) 코어 서비스.
    연구노트, 프로토콜, 템플릿, 첨부파일, 링크, 리비전, 태그, 공통코드를 관리합니다.

    ## 인증
    모든 엔드포인트는 Bearer JWT 토큰이 필요합니다.
    api-gateway가 JWT를 검증하고 다음 헤더를 주입합니다:
    - `x-user-id`: 사용자 ID
    - `x-user-role`: 사용자 역할 (`admin` | `reviewer` | `researcher`)
    - `x-user-permissions`: 권한 목록 (쉼표 구분)
    - `x-user-org-id`: 조직 ID

    ## 노트 상태 흐름
    ```
    draft ↔ in_progress → locked (Reviewer/Admin만)
                        → signed (서명 서비스 이벤트, 자동 전환)
    locked → draft      (Admin 잠금 해제 전용 엔드포인트)
    signed              (불변 — 어떤 전환도 불가)
    ```
  version: 1.0.0
  contact:
    name: LabNote 개발팀

servers:
  - url: http://localhost:8002
    description: 로컬 개발 서버
  - url: http://eln-service:8002
    description: Docker 내부 네트워크

tags:
  - name: 노트
    description: 연구노트 CRUD 및 상태 관리
  - name: 프로토콜
    description: 프로토콜(type=template) 관리 — 노트 핸들러 재사용
  - name: 태그
    description: 연구노트/프로토콜 태그 목록 조회
  - name: 첨부파일
    description: 노트 첨부파일 관리
  - name: 링크
    description: 노트 간 교차 참조 링크 관리
  - name: 리비전
    description: 노트 버전 이력 조회
  - name: 템플릿
    description: 템플릿 CRUD 및 추천/복사
  - name: 코드
    description: 공통 코드 관리 (카테고리 등)
  - name: 헬스체크
    description: 서비스 상태 확인

security:
  - BearerAuth: []

paths:

  # ──────────────────────────────────────────────────────────
  # 헬스체크
  # ──────────────────────────────────────────────────────────

  /health:
    get:
      tags: [헬스체크]
      summary: 서비스 헬스체크
      description: DB 연결 상태 및 이벤트 컨슈머 실행 여부를 확인합니다.
      security: []
      responses:
        '200':
          description: 서비스 상태 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ──────────────────────────────────────────────────────────
  # 태그
  # ──────────────────────────────────────────────────────────

  /api/tags:
    get:
      tags: [태그]
      summary: 태그 목록 조회
      description: 조직 내 삭제되지 않은 노트/프로토콜에서 사용 중인 모든 고유 태그를 반환합니다. DB 레벨에서 중복 제거 및 알파벳 정렬이 적용됩니다.
      parameters:
        - name: type
          in: query
          description: 조회할 노트 타입
          schema:
            $ref: '#/components/schemas/NoteType'
          example: note
      responses:
        '200':
          description: 태그 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                        example: ['PCR', '세포배양', '단백질정제']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ──────────────────────────────────────────────────────────
  # 연구노트
  # ──────────────────────────────────────────────────────────

  /api/notes:
    get:
      tags: [노트]
      summary: 연구노트 목록 조회
      description: |
        조직 내 연구노트 목록을 페이지네이션하여 반환합니다.
        - Admin: 조직 전체 노트 조회 가능
        - Researcher/Reviewer: 본인 노트 + 소속 팀 노트 + 팀 미지정(공개) 노트만 조회
      parameters:
        - name: status
          in: query
          description: 상태 필터
          schema:
            $ref: '#/components/schemas/NoteStatus'
        - name: tag
          in: query
          description: 태그 필터 (정확히 일치하는 태그가 있는 노트)
          schema:
            type: string
        - name: search
          in: query
          description: 제목/본문 전문 검색 (대소문자 무시)
          schema:
            type: string
        - name: templateId
          in: query
          description: 특정 템플릿으로 생성된 노트만 조회
          schema:
            type: string
            format: uuid
        - name: authorId
          in: query
          description: 특정 작성자의 노트만 조회 (대시보드 집계용)
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          description: 특정 팀의 노트만 조회 (대시보드 집계용)
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 페이지 번호 (1부터 시작)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: 페이지당 항목 수
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 연구노트 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Note'
                      total:
                        type: integer
                        description: 전체 노트 수
                      page:
                        type: integer
                        description: 현재 페이지
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [노트]
      summary: 연구노트 생성
      description: |
        새 연구노트를 생성합니다. 생성 시 리비전 1이 자동으로 기록됩니다.
        `templateId`를 지정하면 해당 템플릿의 `useCount`가 1 증가합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: 생성된 연구노트
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notes/stats:
    get:
      tags: [노트]
      summary: 연구노트 상태별 통계
      description: 조직 내 노트를 상태별로 집계하여 카운트를 반환합니다. `/api/notes/:id` 라우트보다 앞에 위치합니다.
      parameters:
        - name: type
          in: query
          description: 집계할 노트 타입
          schema:
            $ref: '#/components/schemas/NoteType'
          example: note
        - name: authorId
          in: query
          description: 특정 작성자 필터 (대시보드 집계용)
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          description: 특정 팀 필터 (대시보드 집계용)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 상태별 노트 통계
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NoteStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notes/batch:
    post:
      tags: [노트]
      summary: 연구노트 일괄 조회
      description: 여러 노트 ID를 한 번에 조회합니다. 최대 500개까지 허용됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotesBatchRequest'
      responses:
        '200':
          description: 요청한 ID에 해당하는 노트 목록 (존재하지 않는 ID는 결과에서 제외)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notes/{id}:
    get:
      tags: [노트]
      summary: 연구노트 단건 조회
      description: ID로 연구노트를 조회합니다. 첨부파일 및 링크 목록이 함께 반환됩니다.
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: 연구노트 상세 (첨부파일, 링크 포함)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NoteWithRelations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [노트]
      summary: 연구노트 수정
      description: |
        연구노트 내용을 수정합니다. 수정 시 새 리비전이 자동으로 기록됩니다.
        - 소유자(authorId) 또는 Admin만 수정 가능
        - `locked` 또는 `signed` 상태의 노트는 수정 불가
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: 수정된 연구노트
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [노트]
      summary: 연구노트 삭제
      description: |
        연구노트를 소프트 삭제합니다(`deletedAt` 설정).
        - 소유자 또는 Admin만 삭제 가능
        - `signed` 또는 `locked` 상태의 노트는 삭제 불가
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 노트가 삭제되었습니다.
                      id:
                        type: string
                        format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/notes/{id}/status:
    patch:
      tags: [노트]
      summary: 연구노트 상태 변경
      description: |
        연구노트 상태를 전환합니다. 허용되지 않는 전환은 400 오류를 반환합니다.

        **일반 사용자 허용 전환:**
        | 현재 상태 | 변경 가능 상태 |
        |-----------|--------------|
        | draft | in_progress |
        | in_progress | draft, locked (Reviewer/Admin만) |
        | signed | 전환 불가 |
        | locked | 전환 불가 (admin-unlock 엔드포인트 사용) |

        **시스템 전용 전환** (`x-user-role: system`):
        - `in_progress` → `signed` (서명 서비스 이벤트로 자동 호출)
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: 상태 변경 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Note'
                      message:
                        type: string
                        example: 상태가 "in_progress"(으)로 변경되었습니다.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/notes/{id}/admin-unlock:
    post:
      tags: [노트]
      summary: 관리자 잠금 해제
      description: |
        Admin 전용 엔드포인트. `locked` 상태의 노트를 `draft`로 되돌립니다.
        - 역할 게이트: `admin` 역할 필수
        - 권한 게이트: `note:unlock` 권한 필수
        - 관리자 비밀번호 검증 후 잠금 해제
        - 상태 이력(`NoteStatusHistory`) 및 감사 로그(`AuditLog`) 이중 기록
        - 노트 작성자에게 잠금 해제 알림 발송
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUnlockRequest'
      responses:
        '200':
          description: 잠금 해제 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Note'
                      auditLog:
                        $ref: '#/components/schemas/AdminUnlockAuditLog'
                      message:
                        type: string
                        example: 관리자 권한으로 노트 잠금이 해제되었습니다.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────
  # 리비전
  # ──────────────────────────────────────────────────────────

  /api/notes/{id}/revisions:
    get:
      tags: [리비전]
      summary: 노트 리비전 목록 조회
      description: 특정 노트의 모든 리비전을 리비전 번호 오름차순으로 반환합니다.
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: 리비전 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NoteRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/notes/{id}/revisions/{rev}:
    get:
      tags: [리비전]
      summary: 노트 리비전 단건 조회
      description: 특정 리비전 번호의 스냅샷을 조회합니다.
      parameters:
        - $ref: '#/components/parameters/NoteId'
        - name: rev
          in: path
          required: true
          description: 리비전 번호 (1부터 시작)
          schema:
            type: integer
            minimum: 1
          example: 3
      responses:
        '200':
          description: 리비전 스냅샷
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NoteRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────
  # 첨부파일
  # ──────────────────────────────────────────────────────────

  /api/notes/{id}/attachments:
    get:
      tags: [첨부파일]
      summary: 노트 첨부파일 목록 조회
      description: 노트에 연결된 첨부파일 목록을 생성일 오름차순으로 반환합니다.
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: 첨부파일 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [첨부파일]
      summary: 노트 첨부파일 등록
      description: |
        file-service에서 업로드 완료된 파일의 메타데이터를 노트에 연결합니다.
        실제 파일 업로드는 file-service를 통해 수행하고, 반환된 `fileId`로 이 엔드포인트를 호출합니다.
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAttachmentRequest'
      responses:
        '201':
          description: 등록된 첨부파일 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/notes/{id}/attachments/{attachmentId}:
    delete:
      tags: [첨부파일]
      summary: 노트 첨부파일 삭제
      description: |
        첨부파일을 삭제합니다.
        - 첨부파일 업로더(`uploadedBy`) 또는 노트 소유자 또는 Admin만 삭제 가능
      parameters:
        - $ref: '#/components/parameters/NoteId'
        - name: attachmentId
