        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────
  # 프로토콜 (type=template, note.controller 재사용)
  # ──────────────────────────────────────────────────────────

  /api/protocols:
    get:
      tags: [프로토콜]
      summary: 프로토콜 목록 조회
      description: |
        `type=template`인 노트(프로토콜) 목록을 반환합니다.
        `GET /api/notes` �核들러를 재사용하며 `type=template` 쿼리가 자동 주입됩니다.
      parameters:
