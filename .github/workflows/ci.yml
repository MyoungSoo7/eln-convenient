name: CI

on:
  push:
    branches: [eln-without-ai]
  pull_request:
    branches: [eln-without-ai]

jobs:
  shared-build:
    name: Build @lab/shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build shared
        working-directory: services/shared
        run: npm ci && npm run build

      - name: Upload shared artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-build
          path: services/shared/dist
          retention-days: 1

  backend-typecheck:
    name: TypeScript Check (Services)
    runs-on: ubuntu-latest
    needs: shared-build
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - eln-service
          - signature-audit-service
          - inventory-service
          - scheduler-service
          - search-service
          - file-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download shared build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: services/shared/dist

      - name: Install shared deps
        working-directory: services/shared
        run: npm ci

      - name: Install service deps
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: TypeScript compile check
        working-directory: services/${{ matrix.service }}
        run: npx tsc --noEmit
        continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [shared-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build api-gateway
        run: docker build -f services/api-gateway/Dockerfile -t eln-gateway:ci services/

      - name: Build auth-service
        run: docker build -f services/auth-service/Dockerfile -t eln-auth:ci services/

      - name: Build eln-service
        run: docker build -f services/eln-service/Dockerfile -t eln-service:ci services/
