name: CI

on:
  push:
    branches: [eln-without-ai]
  pull_request:
    branches: [eln-without-ai]

jobs:
  shared-build:
    name: Build @lab/shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 노드 20 은 2026-04-30 EOL. frontend-build 는 이미 22 이므로 여기만 20 이면
          # 같은 리포 안에서 두 갈래가 된다.
          node-version: '22'

      - name: Install & build shared
        working-directory: services/shared
        run: npm ci && npm run build

      - name: Upload shared artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-build
          path: services/shared/dist
          retention-days: 1

  backend-typecheck:
    name: TypeScript Check (Services)
    runs-on: ubuntu-latest
    needs: shared-build
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - eln-service
          - signature-audit-service
          - inventory-service
          - scheduler-service
          - search-service
          - file-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 노드 20 은 2026-04-30 EOL. frontend-build 는 이미 22 이므로 여기만 20 이면
          # 같은 리포 안에서 두 갈래가 된다.
          node-version: '22'

      - name: Download shared build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: services/shared/dist

      - name: Install shared deps
        working-directory: services/shared
        run: npm ci

      - name: Install service deps
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: TypeScript compile check
        working-directory: services/${{ matrix.service }}
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [shared-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      # 컨텍스트는 도커파일마다 다르다. api-gateway 는 COPY package*.json ./ 로
      # **자기 디렉터리**를 기대하므로 services/ 를 주면 /app/package.json 이 없어
      # npm install 이 ENOENT 로 죽는다. auth/eln 은 COPY shared/ 를 하므로 services/ 가 맞다.
      - name: Build api-gateway
        run: docker build -f services/api-gateway/Dockerfile -t eln-gateway:ci services/api-gateway

      - name: Build auth-service
        run: docker build -f services/auth-service/Dockerfile -t eln-auth:ci services/

      - name: Build eln-service
        run: docker build -f services/eln-service/Dockerfile -t eln-service:ci services/
