name: CI

on:
  # main = AI 스택 포함 라인, eln-without-ai = AI 뺀 라인. 두 갈래 다 게이트를 받는다.
  push:
    branches: [main, eln-without-ai]
  pull_request:
    branches: [main, eln-without-ai]

jobs:
  shared-build:
    name: Build @lab/shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 노드 20 은 2026-04-30 EOL. frontend-build 는 이미 22 이므로 여기만 20 이면
          # 같은 리포 안에서 두 갈래가 된다.
          node-version: '22'

      - name: Install & build shared
        working-directory: services/shared
        run: npm ci && npm run build

      # shared 의 테스트는 여기서 돈다. 아래 매트릭스는 shared 를 dist 아티팩트로만
      # 받으므로 shared 자신은 그 매트릭스에 없다.
      - name: Test shared
        working-directory: services/shared
        run: npm test

      - name: Upload shared artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-build
          path: services/shared/dist
          retention-days: 1

  backend-typecheck:
    name: Typecheck & Test (Services)
    runs-on: ubuntu-latest
    needs: shared-build
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - eln-service
          - signature-audit-service
          - inventory-service
          - scheduler-service
          - search-service
          - file-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 노드 20 은 2026-04-30 EOL. frontend-build 는 이미 22 이므로 여기만 20 이면
          # 같은 리포 안에서 두 갈래가 된다.
          node-version: '22'

      - name: Download shared build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: services/shared/dist

      - name: Install shared deps
        working-directory: services/shared
        run: npm ci

      - name: Install service deps
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: TypeScript compile check
        working-directory: services/${{ matrix.service }}
        run: npx tsc --noEmit

      # 이 리포에는 2026-03-30 부터 테스트 파일이 17개 있었지만 워크플로가 한 번도
      # 실행한 적이 없다. 그 사이 org 스코핑 리팩터(findUnique→findFirst,
      # x-user-org-id 필수)가 들어가며 목과 픽스처가 통째로 낡았는데 아무도 몰랐다.
      # 게이트가 없으면 테스트는 조용히 썩는다. continue-on-error 를 붙이지 않는다 —
      # 붙이는 순간 이 잡도 방금 걷어낸 빈 게이트가 된다.
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: npm test

  # AI 스택 6개는 매트릭스 밖에 있었다. 그 사이 model-registry / fine-tune-jobs 는
  # Prisma 의 Json 컬럼에 Record<string, unknown> 을 넘기고 있어 애초에 컴파일이
  # 된 적이 없는데, 아무도 몰랐다. 게이트가 없는 서비스는 썩는다.
  #
  # 위 잡과 달리 npm test 를 돌리지 않는다. 6개 다 테스트 파일이 0개고 그중 셋은
  # test 스크립트조차 없어서, 지금 test 를 넣으면 게이트가 아니라 그냥 빨간 잡이
  # 된다. 타입체크만이라도 정직하게 거는 쪽을 택한다. 테스트 0개는 별개의 빚으로
  # 남아 있다 — 이 잡이 그걸 가려주지는 않는다.
  ai-typecheck:
    name: Typecheck (AI Services)
    runs-on: ubuntu-latest
    needs: shared-build
    strategy:
      matrix:
        service:
          - ai-assistant-service
          - gemma-gateway
          - model-registry-service
          - eval-harness-service
          - experiment-tracker-service
          - fine-tune-jobs-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download shared build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: services/shared/dist

      - name: Install shared deps
        working-directory: services/shared
        run: npm ci

      - name: Install service deps
        working-directory: services/${{ matrix.service }}
        run: npm ci

      # Prisma 클라이언트가 생성돼 있지 않으면 Prisma.InputJsonObject 같은 타입이
      # 스텁으로 잡혀 검사가 헐거워진다. 스키마가 있는 서비스만 생성한다.
      - name: Generate Prisma client
        working-directory: services/${{ matrix.service }}
        run: '[ -f prisma/schema.prisma ] && npx prisma generate || echo "prisma 스키마 없음 — 건너뜀"'

      - name: TypeScript compile check
        working-directory: services/${{ matrix.service }}
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [shared-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      # 컨텍스트는 도커파일마다 다르다. api-gateway 는 COPY package*.json ./ 로
      # **자기 디렉터리**를 기대하므로 services/ 를 주면 /app/package.json 이 없어
      # npm install 이 ENOENT 로 죽는다. auth/eln 은 COPY shared/ 를 하므로 services/ 가 맞다.
      - name: Build api-gateway
        run: docker build -f services/api-gateway/Dockerfile -t eln-gateway:ci services/api-gateway

      - name: Build auth-service
        run: docker build -f services/auth-service/Dockerfile -t eln-auth:ci services/

      - name: Build eln-service
        run: docker build -f services/eln-service/Dockerfile -t eln-service:ci services/
