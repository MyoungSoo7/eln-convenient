    frontend/src/ services/auth-service/src/ 2>/dev/null | grep -v node_modules |
    grep -v test && exit 1 || echo CLEAN
  output_assertion: CLEAN
- description: Note export functionality is owned solely by signature-audit service
    with no export generation code remaining in eln-service
