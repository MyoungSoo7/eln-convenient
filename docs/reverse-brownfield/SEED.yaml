goal: Correct identified defects in the on-premises ELN (Docker Compose MSA, 8 services
  + api-gateway) at /Users/lms/eln-convenient branch eln-without-ai commit 7012f7a
  — enforcing note state machine immutability, signature content binding, audit tamper
  evidence, and service boundary contracts while preserving existing strengths and
  adding no absent functionality
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: /Users/lms/eln-convenient
    role: primary
    summary: ELN monorepo — Docker Compose MSA with api-gateway + 8 services (auth,
      eln, signature-audit, inventory, scheduler, search, file, collab), React SPA
      frontend, Prisma 5 per-service schemas, PostgreSQL 15, Redis, MinIO, OpenSearch;
      base commit 7012f7a on branch eln-without-ai
  existing_patterns:
  - Fastify 4 route/controller/service layering across all backend services
  - Prisma 5 per-service schema with service-isolated PostgreSQL databases
  - Redis Stream labnote:events for cross-service event publishing with Consumer Group
    subscription and XPENDING/XCLAIM orphan recovery
  - requireInternalSecret middleware for inter-service HTTP authentication
  - orgId tenancy filter on all data queries across every service
  - noteStatusHistory for state transition audit within eln-service using prisma.$transaction
    for atomicity (except admin unlock which is the defect)
  - lib/audit.ts fire-and-forget HTTP POST to signature-audit /audit/internal with
    console.error on failure (to be corrected to outbox)
  - BullMQ job queues for async processing including notifications and exports with
    idempotencyKey deduplication
  - patchNoteStatus via Redis Stream with HTTP PATCH fallback and graceful degradation
    — signature authority is truth and note.status is derived projection
  - Soft delete pattern across entities
  - NoteRevision auto-accumulation on update with read-only GET exposure
  - NoteLink generic typed relationship structure with targetType/targetId/label
  existing_dependencies:
  - Fastify 4
  - Prisma 5
  - PostgreSQL 15
  - Redis (Streams, pub/sub, caching)
  - MinIO (S3-compatible object storage)
  - OpenSearch (full-text search)
  - BullMQ (job queues)
  - React (SPA frontend)
  - Docker Compose (orchestration)
constraints:
- Closed-network on-premises deployment; no external API calls permitted
- Service boundaries must not be merged — each boundary carries a regulatory invariant;
  audit writes belong exclusively to signature-audit service
- Do not claim compliance with any named regulatory standard
- 'Reverse brownfield discipline: no functionality absent from the codebase at commit
  7012f7a may be invented; addendum/correction-note is a documented gap not implemented
  in this Seed'
- All defect items carried from PM stage must be re-verified against commit 7012f7a
  before correction is applied; treating unverified assumptions as confirmed facts
  is the highest-risk failure mode
- 'State machine: draft ↔ in_progress → locked, in_progress → signed (via signature-audit
  only); signed is permanent terminal — no code path may mutate a signed note under
  any circumstance; locked → draft requires admin role + password re-confirmation'
- 4 roles, 24 permissions, orgId tenancy across all services, self-sign prohibition,
  and password re-confirmation before signing are structural invariants
- Future addendum must preserve signed note immutability via NoteLink to a new draft
  note and depends on signature content binding being complete first — this dependency
  and direction are recorded but not implemented
- Signing creates its signature record and audit log within a single service-local
  database transaction (both are in signature-audit DB); lock and unlock use an eln-service
  outbox pattern for audit delivery to avoid coupling availability to signature-audit
- Package manager unification is decided by inspecting what Dockerfiles invoke; the
  decision procedure is fixed but the choice of manager is not pre-decided
- Note status (note.status) is a derived projection of the signature authority; the
  existing eventual consistency via Redis Stream and HTTP PATCH fallback is preserved,
  not replaced with synchronous coupling
