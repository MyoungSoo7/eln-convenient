    createdAt and prevHash
  semantic_ac_key: ac_74c3c95ccd8c9cb1
- description: 'Regulatory critical transitions never silently lose audit records:
    signing is atomic with its audit entry; lock and unlock audit is reliably delivered
    with no silent loss even when signature-audit is temporarily unavailable; admin
    unlock cannot succeed without its state change and history record being committed
    in one transaction; undelivered audit count and maximum delay are exposed as queryable
    metrics'
  semantic_ac_key: ac_b2e3da7fcedc5c91
- description: Note status drift from the signature authority is detectable via a
    mechanism that identifies notes where a signature record exists but note status
    is not signed or where note status is signed but no signature record exists
  semantic_ac_key: ac_41d57caf9cb0fbd2
- description: 'Search indexing failures are observable: XADD failure count and Redis
    Stream backlog and dead-letter discard count are exposed as metrics; dead letters
    are retained not silently ACKed and discarded; the admin bulk-reindex endpoint
    remains callable'
  semantic_ac_key: ac_f886b4308e9861c7
- description: Exactly one package manager lock file format exists in the repository
    with all other lock file formats removed and the chosen manager matching what
    Dockerfiles invoke
  semantic_ac_key: ac_62a9816cb1e0ae47
  verify_command: python3 -c "import os; found=[f for f in ['bun.lock','bun.lockb','package-lock.json','yarn.lock','pnpm-lock.yaml']
    if os.path.exists(f)]; mgrs=set(); [mgrs.add('bun') for f in found if 'bun' in
    f]; [mgrs.add('npm') for f in found if 'package' in f]; [mgrs.add('yarn') for
    f in found if 'yarn' in f]; [mgrs.add('pnpm') for f in found if 'pnpm' in f];
    print('UNIFIED' if len(mgrs)==1 else 'MIXED')"
  output_assertion: UNIFIED
ontology_schema:
  name: ELNRegulatoryDomain
  description: Domain model for an on-premises Electronic Lab Notebook enforcing regulatory
    invariants — note lifecycle state machine, cryptographic signature binding, tamper-evident
    audit chain, and organizational tenancy
  fields:
  - name: Note
    type: object
    description: Core research note entity governed by the state machine (draft/in_progress/locked/signed)
      with content sections, tags, attachments, links, and soft-delete — subject to
      signed/locked immutability freeze
    required: true
  - name: NoteStatus
    type: string
    description: 'Lifecycle state enum: draft, in_progress, locked, signed — governs
      which mutations are permitted on the note and its relations'
    required: true
  - name: StateTransition
    type: object
    description: 'Permitted state change with preconditions: role requirements, password
      re-confirmation for locked-to-draft, signature-audit service ownership for in_progress-to-signed'
    required: true
  - name: Signature
    type: object
    description: Cryptographic binding of signer to note content forming a per-note
      hash chain with noteId, signerId, contentDigest, hash, prevHash, chainIndex,
      comment, and createdAt
    required: true
  - name: AuditLog
    type: object
    description: 'Tamper-evident audit record with per-orgId hash chain — fields:
      entityType, entityId, action, actorId, orgId, details, ipAddress, hash, prevHash,
      chainIndex, createdAt'
    required: true
  - name: Organization
    type: object
    description: Tenancy boundary — orgId scopes all data queries and audit chains
      across every service
    required: true
  # [검증 결과 오류] 아래 team_leader 는 코드에 없다. 실제는 admin/researcher/reviewer/viewer.
  - name: Role
    type: string
    description: One of four system roles (researcher, reviewer, team_leader, admin)
      mapped to 24 granular permissions; signing requires reviewer, team_leader, or
      admin
    required: true
  - name: NoteLink
    type: object
    description: Typed relationship between notes with sourceId, targetId, targetType,
      and label — designated vehicle for future addendum/correction references without
      modifying signed originals
    required: true
  - name: NoteAttachment
    type: object
    description: File attachment bound to a note, subject to signed/locked immutability
      freeze alongside content and links
    required: true
  - name: NoteRevision
    type: object
    description: Read-only version snapshot auto-accumulated on note update, exposed
      via two GET endpoints only — no mutation API exists
    required: true
  - name: NoteStatusHistory
    type: object
    description: Intra-eln-service record of each state transition, must be committed
      atomically with the state change itself including admin unlock
    required: true
  - name: OutboxEntry
    type: object
    description: Reliable delivery buffer in eln-service for audit records destined
      for signature-audit, ensuring no silent loss on cross-service delivery with
      retry and metric exposure
    required: true
evaluation_principles:
- name: Regulatory invariant fidelity
  description: State machine transitions, signature immutability, signed/locked freeze
    scope, audit chain integrity, and self-sign prohibition are correctly enforced
    with no bypass path across REST and WebSocket interfaces
  weight: 0.35
- name: Service boundary preservation
  description: No service boundary is merged or crossed in violation; audit write
    ownership stays in signature-audit, export stays in signature-audit, state transitions
    stay in their owning services
  weight: 0.2
- name: Reverse brownfield discipline
  description: No functionality absent from the codebase at commit 7012f7a is introduced;
    corrections address only identified and re-verified defects; known gaps are documented
    not filled
  weight: 0.2
- name: Verification completeness
  description: Every corrected defect has automated test coverage on regulatory critical
    paths; CI configuration causes pipeline failure on any test failure; verification
    routines recompute from stored data not just check relationships
  weight: 0.15
- name: Existing strength preservation
  description: Password re-confirmation before signing, self-sign prohibition, signer
    role restriction to reviewer/admin/team_leader, audit log ipAddress capture, soft
    delete, event-based search indexing with consumer group recovery, and eventual
    consistency for note status projection are preserved intact
  weight: 0.1
