<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabNote ELN - 시퀀스 다이어그램</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f0;--bg3:#eae8e1;
  --text:#1a1a1a;--text2:#5f5e5a;--text3:#888780;
  --border:#d3d1c7;--border2:#b4b2a9;
  --accent:#185fa5;--accent-bg:#e6f1fb;--accent-text:#0c447c;
  --note-bg:#fef9f0;--note-border:#d3d1c7;--note-text:#5f5e5a;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18;--bg2:#2a2a28;--bg3:#3a3a37;
    --text:#e0ded6;--text2:#9c9a92;--text3:#73726c;
    --border:#444441;--border2:#5f5e5a;
    --accent:#85b7eb;--accent-bg:#0c2d4a;--accent-text:#b5d4f4;
    --note-bg:#2a2a28;--note-border:#5f5e5a;--note-text:#9c9a92;
  }
}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:15px;font-weight:600;margin-bottom:2px}
.sidebar-header p{font-size:12px;color:var(--text3)}
.sidebar-search{padding:8px 12px}
.sidebar-search input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;outline:none}
.sidebar-search input:focus{border-color:var(--accent)}
.sidebar-nav{flex:1;overflow-y:auto;padding-bottom:12px}
.nav-group{padding:4px 0}
.nav-group-title{font-size:10px;font-weight:600;color:var(--text3);padding:10px 16px 4px;text-transform:uppercase;letter-spacing:0.8px}
.nav-item{font-size:13px;padding:7px 16px;cursor:pointer;color:var(--text2);border-left:3px solid transparent;transition:all 0.12s;display:flex;align-items:baseline;gap:6px}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent-text);border-left-color:var(--accent);font-weight:500}
.nav-item .num{font-size:11px;font-weight:600;opacity:0.5;min-width:22px}
.nav-item .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item.hidden{display:none}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);display:flex;justify-content:space-between}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{padding:16px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.main-header-left{display:flex;align-items:baseline;gap:10px}
.main-header-left h2{font-size:17px;font-weight:600}
.main-header-left .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--accent-bg);color:var(--accent-text);font-weight:500}
.main-header-right{display:flex;gap:6px}
.main-header-right button{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text2);cursor:pointer;font-size:12px;transition:all 0.12s}
.main-header-right button:hover{background:var(--bg2);color:var(--text)}
.main-header-right button:disabled{opacity:0.3;cursor:default}

.main-body{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start}
#mermaid-container{max-width:100%;overflow-x:auto}
#mermaid-container svg{max-width:100%;height:auto}

.main-footer{padding:8px 24px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);display:flex;justify-content:space-between;flex-shrink:0}

@media(max-width:768px){
  .sidebar{width:200px}
  .main-body{padding:12px}
}
@media print{
  .sidebar,.main-header,.main-footer{display:none}
  .main-body{padding:0;overflow:visible}
  body{height:auto;overflow:visible}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>LabNote ELN</h1>
    <p>시퀀스 다이어그램 · 23개 기능</p>
  </div>
  <div class="sidebar-search">
    <input type="text" id="search" placeholder="다이어그램 검색..." oninput="filterNav(this.value)">
  </div>
  <div class="sidebar-nav" id="nav"></div>
  <div class="sidebar-footer">
    <span id="counter">1 / 23</span>
    <span>기능명세서 23개 기능 대응</span>
  </div>
</div>

<div class="main">
  <div class="main-header">
    <div class="main-header-left">
      <h2 id="dtitle"></h2>
      <span class="badge" id="dbadge"></span>
    </div>
    <div class="main-header-right">
      <button onclick="go(-1)" id="btn-prev">← 이전</button>
      <button onclick="go(1)" id="btn-next">다음 →</button>
    </div>
  </div>
  <div class="main-body">
    <div id="mermaid-container"></div>
  </div>
  <div class="main-footer">
    <span id="participants"></span>
    <span id="group-info"></span>
  </div>
</div>

<script>
const diagrams=[
{g:"인증/사용자",id:"#1",t:"로그인 및 세션 관리",m:`sequenceDiagram
    participant U as 사용자
    participant FE as 프론트엔드
    participant GW as API Gateway
    participant Auth as Auth Service

    U->>FE: 이메일/비밀번호 입력
    FE->>GW: POST /api/auth/login
    GW->>Auth: POST /api/auth/login
    Auth->>Auth: 비밀번호 검증 (bcrypt)
    Auth-->>GW: {token, refreshToken, user}
    GW-->>FE: 로그인 성공

    FE->>GW: POST /api/auth/session
    Note over GW: refreshToken을 HttpOnly 쿠키에 저장<br/>(labnote_rt, Max-Age=28800)
    GW-->>FE: 세션 설정 완료

    Note over FE: 이후 모든 요청에 Authorization: Bearer 토큰 포함

    rect rgb(255, 245, 230)
        Note over FE,GW: 세션 갱신 (토큰 만료 전)
        FE->>GW: POST /api/auth/session/refresh
        GW->>GW: 쿠키에서 refreshToken 추출
        GW->>Auth: POST /api/auth/refresh
        Auth-->>GW: 새 token + refreshToken
        GW-->>FE: 새 토큰 + 쿠키 갱신
    end`},
{g:"인증/사용자",id:"#2",t:"회원가입 (사용자 생성)",m:`sequenceDiagram
    participant Admin as 관리자
    participant GW as API Gateway
    participant Auth as Auth Service
    participant Sig as Signature-Audit Service

    Admin->>GW: POST /api/auth/register
    Note over GW: JWT 검증 → x-user-role=admin 확인
    GW->>Auth: POST /api/auth/register
    Auth->>Auth: 이메일 중복 확인
    Auth->>Auth: 비밀번호 해시 (bcrypt)
    Auth->>Auth: 사용자 생성 + 역할 배정

    Auth-->>GW: { ok: true, data: user }

    Auth-)Sig: POST /api/audit/internal
    Note over Auth,Sig: x-internal-secret 헤더<br/>action: "created"

    GW-->>Admin: 사용자 생성 완료`},
{g:"인증/사용자",id:"#3",t:"사용자/팀/조직 관리",m:`sequenceDiagram
    participant Admin as 관리자
    participant GW as API Gateway
    participant Auth as Auth Service
    participant Sig as Signature-Audit Service

    rect rgb(240, 248, 255)
        Note over Admin,Sig: 사용자 관리
        Admin->>GW: GET/POST/PUT/DELETE /api/auth/users
        GW->>Auth: 요청 전달 (requireRole: admin)
        Auth-->>GW: 결과
        Auth-)Sig: POST /api/audit/internal (감사로그)
        GW-->>Admin: 응답
    end

    rect rgb(245, 255, 245)
        Note over Admin,Sig: 팀 관리
        Admin->>GW: POST /api/auth/teams
        GW->>Auth: 팀 생성 (admin)
        Auth-->>GW: 팀 생성 완료
        Admin->>GW: POST /api/auth/teams/:id/members
        GW->>Auth: 팀원 추가
        Auth->>Auth: 중복 팀원 검사
        Auth-->>GW: 팀원 추가 완료
        Auth-)Sig: POST /api/audit/internal (감사로그)
    end

    rect rgb(255, 245, 250)
        Note over Admin,Sig: 역할/권한 관리
        Admin->>GW: POST /api/auth/roles
        GW->>Auth: 역할 생성 + 24개 권한 설정
        Auth-->>GW: 역할 생성 완료
        Auth-)Sig: POST /api/audit/internal (감사로그)
    end`},
{g:"연구노트",id:"#4",t:"연구노트 작성 및 편집",m:`sequenceDiagram
    participant U as 사용자
    participant GW as API Gateway
    participant ELN as ELN Service
    participant Search as Search Service
    participant Sig as Signature-Audit Service

    U->>GW: POST /api/notes
    GW->>ELN: 노트 생성 요청
    ELN->>ELN: Note 생성 (status=draft)
    ELN->>ELN: NoteRevision 생성 (revision=1)
    ELN-)Search: POST /api/search/index
    Note over ELN,Search: x-internal-secret<br/>domainType: "NOTE"
    ELN-)Sig: POST /api/audit/internal (감사로그)
    ELN-->>GW: { ok: true, data: note }
    GW-->>U: 노트 생성 완료

    rect rgb(240, 248, 255)
        Note over U,Sig: 노트 수정
        U->>GW: PUT /api/notes/:id
        GW->>ELN: 노트 수정 요청
        ELN->>ELN: signed/locked 상태 체크 → 수정 불가 시 에러
        ELN->>ELN: Note 업데이트
        ELN->>ELN: NoteRevision 생성 (revision 자동 증가)
        ELN-)Search: POST /api/search/index (재인덱싱)
        ELN-)Sig: POST /api/audit/internal
        ELN-->>GW: 수정 완료
    end`},
{g:"연구노트",id:"#5",t:"실시간 협업 편집",m:`sequenceDiagram
    participant U1 as 사용자A
    participant U2 as 사용자B
    participant GW as API Gateway
    participant Collab as Collab Service
    participant ELN as ELN Service
    participant Redis as Redis

    U1->>GW: WS /collab/notes/:noteId?token=JWT
    GW->>Collab: WebSocket 프록시
    Collab->>Collab: JWT 검증 (자체 수행)
    Collab->>ELN: GET /api/notes/:noteId (상태 확인)
    Note over Collab,ELN: x-internal-secret
    alt signed/locked
        Collab-->>U1: { type: "read-only" }
    end
    Collab->>Collab: Room 입장 + 색상 배정 (8색)
    Collab-->>U1: { type: "joined", users: [...] }

    U2->>GW: WS /collab/notes/:noteId?token=JWT
    GW->>Collab: WebSocket 프록시
    Collab-->>U1: { type: "user-joined", userId, colorIdx }
    Collab-->>U2: { type: "joined", users: [...] }

    rect rgb(240, 248, 255)
        Note over U1,Redis: 실시간 편집 동기화
        U1->>Collab: { type: "content-update", content }
        Collab->>Collab: 로컬 broadcast (같은 인스턴스)
        Collab->>Redis: PUBLISH labnote:collab
        Note over Redis: 멀티 인스턴스 지원
        Collab-->>U2: { type: "content-update", content }
    end

    U1->>Collab: 연결 종료
    Collab-->>U2: { type: "user-left", userId }`},
{g:"연구노트",id:"#6",t:"연구노트 상태 전환",m:`sequenceDiagram
    participant U as 사용자
    participant GW as API Gateway
    participant ELN as ELN Service
    participant Sig as Signature-Audit Service
    participant Redis as Redis

    U->>GW: PATCH /api/notes/:id/status { status: "in_progress" }
    GW->>ELN: 상태 변경 요청
    ELN->>ELN: 전환 규칙 검증 (ALLOWED_STATUS_TRANSITIONS)
    Note over ELN: draft→in_progress ✓<br/>in_progress→draft ✓<br/>in_progress→locked (reviewer/admin만)
    ELN->>ELN: DB 트랜잭션 (FOR UPDATE)
    ELN->>ELN: NoteStatusHistory 기록

    ELN-)Sig: POST /api/audit/internal (감사로그)
    ELN-)Redis: PUBLISH labnote:note-status
    Note over Redis: collab-service 캐시 무효화

    alt in_progress → locked (잠금)
        ELN-)Sig: POST /api/notifications/internal
        Note over Sig: type: NOTE_LOCKED<br/>recipient: 노트 작성자
    end

    ELN-->>GW: { ok: true, data: note }
    GW-->>U: 상태 변경 완료`},
{g:"연구노트",id:"#7",t:"연구노트 최종 전자서명",m:`sequenceDiagram
    participant U as 검토자/관리자
    participant GW as API Gateway
    participant Sig as Signature-Audit Service
    participant Auth as Auth Service
    participant ELN as ELN Service
    participant Redis as Redis

    U->>GW: POST /api/signatures/sign/:noteId { password }
    GW->>Sig: 서명 요청

    Sig->>Sig: 권한 검증 (reviewer/admin/team-leader)
    Sig->>Sig: 자기 노트 서명 불가 체크 (admin 제외)

    Sig->>Auth: POST /api/auth/internal/verify-password
    Note over Sig,Auth: x-internal-secret<br/>{ userId, password }
    Auth-->>Sig: 비밀번호 확인

    Sig->>Sig: 해시 체인 생성
    Note over Sig: sha256(noteId:signerId:timestamp:prevHash)
    Sig->>Sig: Signature + AuditLog DB 저장

    rect rgb(255, 245, 230)
        Note over Sig,ELN: 노트 상태 전환 (in_progress → signed)
        Sig->>Redis: XADD labnote:events (NOTE_SIGNED)
        Note over Redis: 1차: Redis Stream 이벤트
        Redis->>ELN: Event Consumer 소비
        ELN->>ELN: 상태 전환 (system 권한)
    end

    rect rgb(255, 240, 240)
        Note over Sig,ELN: Redis 실패 시 폴백
        Sig->>ELN: PATCH /api/notes/:noteId/status
        Note over Sig,ELN: x-user-role=system<br/>{ status: "signed" }
    end

    Sig-)Sig: POST /api/notifications/internal
    Note over Sig: type: NOTE_SIGNED<br/>recipient: 노트 작성자
    Sig->>Redis: PUBLISH notifications:{userId}

    Sig-->>GW: { ok: true, data: signature }
    GW-->>U: 서명 완료`},
{g:"연구노트",id:"#8",t:"관리자 잠금 해제",m:`sequenceDiagram
    participant Admin as 관리자
    participant GW as API Gateway
    participant ELN as ELN Service
    participant Auth as Auth Service
    participant Sig as Signature-Audit Service

    Admin->>GW: POST /api/notes/:id/admin-unlock
    Note over GW: requireRole(ADMIN) + requirePermission(NOTE_UNLOCK)
    GW->>ELN: 잠금 해제 요청 { adminPassword, reason }

    ELN->>ELN: 노트 상태 확인 (locked만 가능)

    ELN->>Auth: POST /api/auth/internal/verify-password
    Note over ELN,Auth: x-internal-secret<br/>관리자 비밀번호 검증
    Auth-->>ELN: 비밀번호 확인

    ELN->>ELN: 상태 전환 (locked → draft)
    ELN->>ELN: NoteStatusHistory 기록 (isAdminAction=true)

    ELN-)Sig: POST /api/audit/internal
    Note over Sig: action: "note.admin_unlocked"<br/>details: { reason }

    ELN-)Sig: POST /api/notifications/internal
    Note over Sig: type: NOTE_UNLOCKED<br/>recipient: 노트 작성자

    ELN-->>GW: { ok: true }
    GW-->>Admin: 잠금 해제 완료`},
{g:"템플릿",id:"#9",t:"템플릿 관리",m:`sequenceDiagram
    participant U as 사용자
    participant GW as API Gateway
    participant ELN as ELN Service
    participant Search as Search Service

    rect rgb(240, 248, 255)
        Note over U,Search: 템플릿 목록 조회 (페이지네이션)
        U->>GW: GET /api/templates?page=1&limit=12&category=...
        GW->>ELN: 템플릿 조회
        ELN->>ELN: 내 조직 + isPublic=true 필터
        ELN-->>GW: { data, total, page, limit }
        GW-->>U: 템플릿 목록 (12개씩)
    end

    rect rgb(245, 255, 245)
        Note over U,Search: 템플릿 생성
        U->>GW: POST /api/templates { title, category, tags }
        GW->>ELN: 템플릿 생성 (isPublic=true 기본값)
        ELN-)Search: POST /api/search/index
        Note over ELN,Search: domainType: "TEMPLATE"
        ELN-->>GW: 201 Created
    end

    rect rgb(255, 245, 250)
        Note over U,Search: 템플릿 복사
        U->>GW: POST /api/templates/:id/copy
        GW->>ELN: 복사 요청
        ELN->>ELN: 원본 조회 (isPublic=true 포함)
        ELN->>ELN: 복사본 생성 (isPublic=false)
        ELN->>ELN: 원본 copyCount +1
        ELN-->>GW: 201 Created (복사본)
    end`},
{g:"템플릿",id:"#10",t:"템플릿 기반 노트 생성",m:`sequenceDiagram
    participant U as 사용자
    participant FE as 프론트엔드
    participant GW as API Gateway
    participant ELN as ELN Service

    U->>FE: 템플릿에서 "노트 작성" 클릭
    FE->>FE: navigate("/notes/new", { fromProtocol, protocolId, title, tags })
    FE->>GW: POST /api/notes { title, templateId, tags }
    GW->>ELN: 노트 생성 요청
    ELN->>ELN: Note 생성 (status=draft)
    ELN->>ELN: Template.useCount +1
    ELN-->>GW: { ok: true, data: note }
    GW-->>FE: 노트 생성 완료
    FE->>FE: 에디터 페이지로 이동`},
{g:"파일/내보내기",id:"#11",t:"파일 업로드 및 다운로드",m:`sequenceDiagram
    participant U as 사용자
    participant GW as API Gateway
    participant File as File Service
    participant MinIO as MinIO
    participant ELN as ELN Service

    rect rgb(240, 248, 255)
        Note over U,ELN: Presigned URL 방식 업로드
        U->>GW: GET /api/files/presigned-upload?filename=...&mimetype=...
        GW->>File: Presigned Upload URL 요청
        File->>File: 차단 확장자 검사 (exe/sh/bat)
        File->>MinIO: Presigned PUT URL 생성
        File-->>GW: { uploadUrl, fileId }
        GW-->>U: Presigned URL

        U->>MinIO: PUT (파일 직접 업로드, 50MB 제한)
        MinIO-->>U: 업로드 완료
    end

    rect rgb(245, 255, 245)
        Note over U,ELN: 노트에 첨부 연결
        U->>GW: POST /api/notes/:id/attachments { fileId, fileName }
        GW->>ELN: 첨부 연결
        ELN->>ELN: signed/locked 체크 → 불가 시 에러
        ELN-->>GW: 첨부 완료
    end

    rect rgb(255, 245, 250)
        Note over U,MinIO: 다운로드
        U->>GW: GET /api/files/:id/url
        GW->>File: 다운로드 URL 요청
        File->>MinIO: Presigned GET URL 생성
        File-->>GW: { downloadUrl }
        GW-->>U: 다운로드 URL
    end`},
{g:"파일/내보내기",id:"#12",t:"PDF/ZIP 내보내기",m:`sequenceDiagram
    participant U as 사용자
    participant GW as API Gateway
    participant Sig as Signature-Audit Service
    participant Queue as BullMQ
    participant Worker as Export Worker
    participant ELN as ELN Service
    participant File as File Service
    participant Redis as Redis

    U->>GW: POST /api/export/pdf/:noteId
    GW->>Sig: PDF 내보내기 요청
    Sig->>Sig: 노트 상태 검증 (signed/locked만)
    Sig->>Sig: ExportJob 생성 (status=pending)
    Sig->>Queue: exportQueue.add("pdf", { noteId, jobId })
    Sig-->>GW: 202 Accepted { jobId, status: "pending" }
    GW-->>U: 작업 시작됨

    rect rgb(240, 248, 255)
        Note over Queue,File: 백그라운드 처리
        Queue->>Worker: Job 실행
        Worker->>ELN: GET /api/notes/:noteId
        Note over Worker,ELN: x-internal-secret

const groups=[...new Set(diagrams.map(d=>d.g))];
const nav=document.getElementById('nav');
let current=0;

function buildNav(){
  nav.innerHTML='';
  groups.forEach(g=>{
    const grp=document.createElement('div');
    grp.className='nav-group';
    grp.innerHTML=`<div class="nav-group-title">${g}</div>`;
    diagrams.filter(d=>d.g===g).forEach(d=>{
      const idx=diagrams.indexOf(d);
      const item=document.createElement('div');
      item.className='nav-item'+(idx===current?' active':'');
      item.innerHTML=`<span class="num">${d.id}</span><span class="label">${d.t}</span>`;
      item.dataset.idx=idx;
      item.onclick=()=>renderDiagram(idx);
      grp.appendChild(item);
    });
    nav.appendChild(grp);
  });
}

function filterNav(q){
  q=q.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el=>{
    const idx=parseInt(el.dataset.idx);
    const d=diagrams[idx];
    const match=!q||d.t.toLowerCase().includes(q)||d.g.toLowerCase().includes(q)||d.id.includes(q)||d.m.toLowerCase().includes(q);
    el.classList.toggle('hidden',!match);
  });
  document.querySelectorAll('.nav-group').forEach(grp=>{
    const visible=grp.querySelectorAll('.nav-item:not(.hidden)').length;
    grp.style.display=visible?'':'none';
  });
}

function extractParticipants(m){
  const ps=[];
  m.split('\n').forEach(l=>{
    const match=l.match(/participant\s+\w+\s+as\s+(.+)/);
    if(match)ps.push(match[1].trim());
  });
  return ps;
}

const dark=matchMedia('(prefers-color-scheme:dark)').matches;
mermaid.initialize({
  startOnLoad:false,
  theme:dark?'dark':'default',
  fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
  sequence:{mirrorActors:false,bottomMarginAdj:1,messageMargin:35,noteMargin:8,actorMargin:16,width:160},
  themeVariables:{
    fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
    fontSize:'13px',
    noteBkgColor:dark?'#2a2a28':'#fef9f0',
    noteTextColor:dark?'#c2c0b6':'#5f5e5a',
    noteBorderColor:dark?'#5f5e5a':'#d3d1c7',
    actorBkg:dark?'#2a2a28':'#e6f1fb',
    actorBorder:dark?'#3a6ea5':'#85b7eb',
    actorTextColor:dark?'#b5d4f4':'#0c447c',
    signalColor:dark?'#c2c0b6':'#3d3d3a',
    signalTextColor:dark?'#c2c0b6':'#3d3d3a',
    labelBoxBkgColor:dark?'#2a2a28':'#f1efe8',
    labelTextColor:dark?'#c2c0b6':'#5f5e5a'
  }
});

async function renderDiagram(idx){
  current=idx;
  const d=diagrams[idx];
  document.getElementById('dtitle').textContent=`${d.id} ${d.t}`;
  document.getElementById('dbadge').textContent=d.g;
  document.getElementById('counter').textContent=`${idx+1} / ${diagrams.length}`;
  document.getElementById('btn-prev').disabled=idx===0;
  document.getElementById('btn-next').disabled=idx===diagrams.length-1;

  const ps=extractParticipants(d.m);
  document.getElementById('participants').textContent=`참여 서비스: ${ps.join(' → ')}`;
  const groupItems=diagrams.filter(x=>x.g===d.g);
  document.getElementById('group-info').textContent=`${d.g} ${groupItems.indexOf(d)+1}/${groupItems.length}`;

  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',parseInt(el.dataset.idx)===idx);
  });
  const active=document.querySelector('.nav-item.active');
  if(active)active.scrollIntoView({block:'nearest',behavior:'smooth'});

  const container=document.getElementById('mermaid-container');
  container.innerHTML='<div style="color:var(--text3);font-size:13px;padding:40px">렌더링 중...</div>';
  try{
    const id='d'+Date.now();
    const{svg}=await mermaid.render(id,d.m);
    container.innerHTML=svg;
    const svgEl=container.querySelector('svg');
    if(svgEl){svgEl.style.maxWidth='100%';svgEl.style.height='auto';}
  }catch(e){
    container.innerHTML=`<div style="color:#a32d2d;font-size:13px;padding:40px">렌더링 오류: ${e.message}</div>`;
  }
}

function go(dir){
  const next=current+dir;
  if(next>=0&&next<diagrams.length)renderDiagram(next);
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1)}
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();go(1)}
});

buildNav();
renderDiagram(0);
</script>
